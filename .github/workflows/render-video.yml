name: Render video
on:
  workflow_dispatch:
    inputs:
      props:
        description: 'Props JSON, mis. {"showCaptions":true,"musicVolume":0.9,"voiceover":false}'
        required: false
        default: '{}'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji
      - run: npm ci
      - run: npx remotion browser ensure
      - run: npx remotion render src/index.ts SidikJariMolekul out/sidik-jari-molekul-1080p.mp4 --codec=h264 --crf=20 --concurrency=4 --props="$PROPS"
        env:
          PROPS: ${{ github.event.inputs.props || '{}' }}
      - uses: actions/upload-artifact@v4
        with:
          name: sidik-jari-molekul-1080p
          path: out/sidik-jari-molekul-1080p.mp4
          retention-days: 14
          compression-level: 0
